<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Sahibinden AI Analiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&subset=latin,latin-ext&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #FFE800;
      --yellow-glow: rgba(255,208,0,.35);
      --text: #111827;
      --text-2: #6B7280;
      --text-3: #9CA3AF;
      --border: #E5E7EB;
      --bg: #FFFFFF;
      --radius: 10px;
      --font: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, system-ui, sans-serif;
    }

    body {
      width: 340px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
    }

    .top-stripe {
      height: 3px;
      background: linear-gradient(90deg, #FFE800 0%, #FBB22A 50%, #FFE800 100%);
    }

    /* Header */
    .popup-header {
      padding: 13px 15px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }

    .header-icon {
      width: 34px; height: 34px;
      background: var(--yellow);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -.3px;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 10px;
      color: var(--text-2);
      font-weight: 500;
      margin-top: 2px;
      letter-spacing: .1px;
    }

    /* Tabs */
    .tab-bar {
      display: flex;
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 9px 4px 8px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-family: var(--font);
      font-size: 10px;
      font-weight: 600;
      color: var(--text-3);
      position: relative;
      transition: color .15s;
      letter-spacing: .1px;
    }

    .tab-btn.active { color: var(--text); }

    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0; left: 22%; right: 22%;
      height: 2px;
      background: var(--yellow);
      border-radius: 2px 2px 0 0;
    }

    .tab-btn:hover:not(.active) { color: var(--text-2); }

    /* Tab content */
    .tab-content { display: none; padding: 13px; flex-direction: column; gap: 8px; }
    .tab-content.active { display: flex; }

    /* Analyze button */
    #btnScrape {
      width: 100%; padding: 12px 16px;
      background: var(--yellow);
      border: none; border-radius: var(--radius);
      color: var(--text); font-size: 13px; font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      transition: background .15s, transform .15s, box-shadow .15s;
      font-family: var(--font);
      box-shadow: 0 2px 10px var(--yellow-glow);
      letter-spacing: -.1px;
    }

    #btnScrape:hover:not(:disabled) {
      background: #FFD91A;
      transform: translateY(-1px);
      box-shadow: 0 4px 14px var(--yellow-glow);
    }

    #btnScrape:active:not(:disabled) { transform: translateY(0); }
    #btnScrape:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }

    #status {
      font-size: 11px;
      color: #EF4444;
      text-align: center;
      min-height: 14px;
      font-weight: 500;
    }

    #inProgress {
      display: none;
      padding: 9px 12px;
      background: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: 8px;
      font-size: 11.5px;
      color: #1D4ED8;
      font-weight: 600;
      align-items: center;
      gap: 8px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-icon { animation: spin 1s linear infinite; }

    /* List */
    .list-empty {
      text-align: center; padding: 26px 16px;
      font-size: 11.5px; color: var(--text-3);
      line-height: 1.65; font-weight: 500;
    }

    .analysis-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      cursor: pointer;
      transition: border-color .15s, box-shadow .15s;
    }

    .analysis-item:hover {
      border-color: var(--yellow);
      box-shadow: 0 2px 10px var(--yellow-glow);
    }

    .ai-item-title {
      font-size: 11.5px; font-weight: 700; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .ai-item-meta { display: flex; gap: 6px; align-items: center; }
    .ai-item-score { font-size: 11.5px; font-weight: 700; }
    .ai-item-verdict {
      font-size: 9px; padding: 2px 7px; border-radius: 10px;
      color: #fff; font-weight: 700; letter-spacing: .3px;
    }
    .ai-item-time { font-size: 10px; color: var(--text-3); margin-left: auto; }

    /* Footer */
    .popup-footer {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 10px; color: var(--text-3);
      font-weight: 500;
    }
    .popup-footer strong { color: var(--text-2); font-weight: 700; }
  </style>
</head>
<body>
  <div class="top-stripe"></div>

  <div class="popup-header">
    <div class="header-icon">
      <img src="assets/icon.png" width="22" height="22" alt="logo" style="display:block;">
    </div>
    <div class="header-text">
      <h1>Sahibinden AI Analiz</h1>
      <p>Yapay Zeka Ekspertizi &mdash; v1.2</p>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" data-tab="analyze">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      Analiz
    </button>
    <button class="tab-btn" data-tab="history">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <polyline points="12 6 12 12 16 14"/>
      </svg>
      Geçmiş
    </button>
    <button class="tab-btn" data-tab="favorites">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/>
      </svg>
      Favoriler
    </button>
  </div>

  <div id="tab-analyze" class="tab-content active">
    <button id="btnScrape">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
      Analizi Başlat
    </button>
    <div id="status"></div>
    <div id="inProgress">
      <svg class="spin-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
      </svg>
      Analiz devam ediyor...
    </div>
  </div>

  <div id="tab-history" class="tab-content">
    <div id="history-list"></div>
  </div>

  <div id="tab-favorites" class="tab-content">
    <div id="favorites-list"></div>
  </div>

  <div class="popup-footer">Coded by <strong>ats</strong> &middot; HNG Software</div>

  <script src="popup.js"></script>
</body>
</html>
